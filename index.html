<script>'use strict';
const $ = s => document.querySelector(s);
const LIFF_ID = '2011631314-VmbGCsip';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxbzI90t9-vwXUsnHMMHQWbtyHu2SsZovWP5VvxXJYYR8dfZ_c1fhi-5nfvWXSYtNPY/exec';
const CONSENT_VERSION = 'form-2026-09-v1';
const STORAGE_KEY = 'irifune-prescription-pending-v2';
let photos = [], ready = false, busy = false, preparing = false, pending = null, snapshot = null;
let storageOK = true;
const screens = { form: $('.form-view'), uploading: $('.uploading'), success: $('.success') };
function screen(name) {
  Object.entries(screens).forEach(([key, el]) => { el.hidden = key !== name; });
  window.scrollTo(0, 0);
}
function error(message) {
  $('#form-error').textContent = message; $('#form-error').hidden = !message;
  if (message) $('#form-error').focus();
}
function canSend() { $('#submitBtn').disabled = !ready || busy || preparing || photos.length === 0 || !$('#consent').checked; }
function storePending(value) {
  pending = value;
  try { if (value) sessionStorage.setItem(STORAGE_KEY, JSON.stringify(value)); else sessionStorage.removeItem(STORAGE_KEY); }
  catch (_) { storageOK = false; }
}
async function rpc(name, ...args) {
  if (!GAS_URL || GAS_URL.includes('ここに')) throw new Error('GAS_URL が設定されていません。');
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({ method: name, args })
    });
    const text = await res.text();
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + text.substring(0, 200));
    let r;
    try { r = JSON.parse(text); }
    catch (_) { throw new Error('GASから想定外の応答を受け取りました。' + text.substring(0, 200)); }
    if (!r.ok) throw new Error(r.message || '通信を確認できませんでした。');
    return r.value;
  } catch (e) {
    if (e && e.message && /^\[/.test(e.message)) throw e;
    throw new Error('通信を確認できませんでした。電波の良い場所で「同じ受付を再開」をお試しください。');
  }
}
function token() {
  const value = window.liff && liff.getIDToken();
  if (!value) throw new Error('LINEのログインを確認できません。画面を開き直してください。');
  return value;
}
function lockForm(value) {
  $('#entryFields').disabled = value;
  $('#submitBtn').disabled = true;
}
function showProgress(saved, total, label) {
  const n = Math.floor(saved / total * 100);
  $('#upload-progress').value = n;
  $('#sent-percent').textContent = n;
  $('#remaining-percent').textContent = 100 - n;
  $('#saved-count').textContent = total + '枚中' + saved + '枚を保存済み';
  $('#upload-title').textContent = label || '処方せんを送信中です';
  $('#upload-lead').textContent = saved === total ? '写真の保存が終わりました。受付結果を確認しています。' : '写真を1枚ずつ薬局へ送っています。';
  $('#upload-progress').setAttribute('aria-valuetext', total + '枚中' + saved + '枚を保存済み');
  $('#upload-progress').hidden = false;
  $('#meter-values').hidden = false;
  $('#meter-detail').hidden = false;
}
function showChecking() {
  $('#upload-title').textContent = '受付を確認しています';
  $('#upload-lead').textContent = '同じ受付番号の保存状況を確認しています。';
  $('#upload-progress').removeAttribute('value');
  $('#upload-progress').removeAttribute('aria-valuetext');
  $('#meter-values').hidden = true; $('#meter-detail').hidden = true;
}
function showComplete(result) {
  busy = false;
  $('#receipt-id').textContent = result.requestId;
  $('#notification-note').hidden = !result.notificationPending;
  storePending(null); snapshot = null; photos = [];
  $('#fileInputCamera').value = ''; $('#fileInputLibrary').value = ''; renderPhotos();
  screen('success'); $('#success-title').focus();
}
function showInterrupted(e) {
  busy = false;
  $('#upload-error').hidden = false;
  $('#upload-error-text').textContent = e.message;
  $('#retryBtn').disabled = false;
  $('.uploading').setAttribute('aria-busy', 'false');
  $('#upload-title').textContent = '送信状況をご確認ください';
  $('#upload-lead').textContent = '写真と入力内容は、この画面に保持しています。';
  $('#upload-error').focus();
}
async function init() {
  try {
    try { pending = JSON.parse(sessionStorage.getItem(STORAGE_KEY) || 'null'); } catch (_) { storageOK = false; }
    if (!GAS_URL || GAS_URL.includes('ここに')) throw new Error('GAS_URL が設定されていません。');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: 'https://liff.line.me/' + LIFF_ID }); return; }
    token(); ready = true;
    if (pending && typeof pending.id === 'string' && Array.isArray(pending.hashes)) {
      busy = true; lockForm(true); screen('uploading'); showChecking();
      try {
        const result = await rpc('getPrescriptionStatus', token(), pending.id);
        if (result.status === 'accepted') { showComplete(result); return; }
        if (result.savedCount === result.total) { showComplete(await rpc('finishPrescription', token(), pending.id)); return; }
        busy = false; screen('form'); lockForm(false);
        error('送信途中の受付があります。同じ写真を同じ順番で追加すると、保存済みの写真を再送せず再開できます。入力内容は送信開始時の内容を使用します。');
      } catch (e) {
        if (/\[MISSING\]/.test(e.message)) { busy = false; screen('form'); lockForm(false); error('前回の送信内容をまだ確認できません。同じ写真を同じ順番で追加し、入力内容を確認して再開してください。'); }
        else { showInterrupted(e); }
      }
    } else pending = null;
    canSend();
  } catch (e) { error(e.message); }
}
async function jpeg(file) {
  if (!file.type.startsWith('image/') || file.size > 20 * 1024 * 1024) throw new Error('1枚20MB以下の写真を選んでください。');
  const url = URL.createObjectURL(file), img = new Image();
  try {
    img.src = url; await img.decode();
    if (!img.naturalWidth || !img.naturalHeight) throw new Error('写真を読み込めません。');
    const MAX_BYTES = 3.0 * 1024 * 1024;
    let scale = Math.min(1, 2800 / Math.max(img.naturalWidth, img.naturalHeight));
    let quality = 0.88;
    let data = '';
    for (let attempt = 0; attempt < 8; attempt++) {
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      data = canvas.toDataURL('image/jpeg', quality);
      const base64 = data.split(',')[1] || '';
      const bytes = Math.floor(base64.length * 3 / 4) - (base64.endsWith('==') ? 2 : base64.endsWith('=') ? 1 : 0);
      if (bytes <= MAX_BYTES) break;
      if (quality > 0.65) quality -= 0.05;
      else scale *= 0.85;
      if (attempt === 7) throw new Error('写真の容量が大きすぎます。解像度を下げて再撮影してください。');
    }
    const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
    const hash = Array.from(new Uint8Array(digest), b => b.toString(16).padStart(2, '0')).join('');
    return { data, hash };
  } catch (e) { throw new Error(e.message.includes('容量') ? e.message : '写真を読み込めませんでした。JPEG・PNGの写真、またはカメラで撮影した写真をお試しください。'); }
  finally { URL.revokeObjectURL(url); }
}
async function onFiles(e) {
  if (busy || snapshot) return;
  const files = Array.from(e.target.files); e.target.value = '';
  if (photos.length + files.length > 10) { error('写真は10枚まで追加できます。'); return; }
  preparing = true; canSend(); $$('.camera').forEach(b => { b.disabled = true; }); error(''); $('#photo-status').textContent = '写真を読み込んでいます…';
  try { for (const file of files) { photos.push(await jpeg(file)); renderPhotos(); } }
  catch (e) { error(e.message); }
  finally { preparing = false; $$('.camera').forEach(b => { b.disabled = false; }); $('#photo-status').textContent = ''; canSend(); }
}
$('#fileInputCamera').addEventListener('change', onFiles);
$('#fileInputLibrary').addEventListener('change', onFiles);
$$('.camera').forEach(b => b.addEventListener('click', () => $('#' + b.dataset.input).click()));
function renderPhotos() {
  const area = $('.carousel'); area.replaceChildren(); $('.photos').hidden = photos.length === 0;
  $('#photo-count').textContent = photos.length + '枚';
  photos.forEach((photo, i) => {
    const card = document.createElement('div'); card.className = 'photo actual-photo';
    const img = document.createElement('img'); img.src = photo.data; img.alt = '処方せんの写真' + (i + 1);
    const open = document.createElement('button'); open.type = 'button'; open.className = 'photo-open'; open.setAttribute('aria-label', '写真' + (i + 1) + 'を拡大');
    open.append(img); open.onclick = () => { $('#large-photo').src = photo.data; $('#photo-dialog').showModal(); };
    const number = document.createElement('span'); number.className = 'number'; number.textContent = i + 1;
    const del = document.createElement('button'); del.type = 'button'; del.className = 'delete'; del.textContent = '×'; del.setAttribute('aria-label', '写真' + (i + 1) + 'を削除');
    del.onclick = () => { if (!busy && !snapshot) { photos.splice(i, 1); renderPhotos(); canSend(); } };
    card.append(open, number, del); area.append(card);
  });
}
$('#close-photo').onclick = () => $('#photo-dialog').close();
function addResidual() {
  if ($$('.residual-item').length >= 15) return;
  const row = document.createElement('div'); row.className = 'residual-item';
  row.innerHTML = '<label>薬名 / Rp番号<input name="medName" maxlength="100" placeholder="薬名 / Rp番号"></label><label>数量<input name="medCount" maxlength="50" placeholder="数量"></label><button type="button" aria-label="この薬を削除">×</button>';
  row.querySelector('button').onclick = () => { if ($$('.residual-item').length > 1) row.remove(); };
  $('#residualList').append(row);
}
function $$(s) { return Array.from(document.querySelectorAll(s)); }
$('#addResidual').onclick = addResidual; addResidual();
const slots = [];
for (let m = 8 * 60; m <= 17 * 60 + 30; m += 30) slots.push(Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0'));
slots.slice(0, -1).forEach(t => $('#timeFrom').add(new Option(t, t)));
slots.slice(1).forEach(t => $('#timeTo').add(new Option(t, t)));
const toMin = t => { const [h, m] = t.split(':'); return Number(h) * 60 + Number(m); };
function updateDetails() {
  const r = $('#remaining').value !== 'なし', d = $('#delivery').value !== '薬局で受け取る', q = $('#request').value !== 'なし';
  $('#residual-fields').hidden = !r; $('#delivery-fields').hidden = !d; $('#request-fields').hidden = !q;
  $('#date-field').hidden = !$('#delivery').value.includes('翌日');
  $('#custom-time-field').hidden = $('#time').value !== '指定';
}
['remaining', 'delivery', 'request', 'time'].forEach(id => $('#' + id).addEventListener('change', updateDetails)); updateDetails();
$('#consent').onchange = canSend;
function collectSurvey() {
  const custom = $('#time').value === '指定';
  const s = {
    residual: $('#remaining').value,
    residualItems: $$('.residual-item').map(el => ({ name: el.querySelector('[name=medName]').value.trim(), count: el.querySelector('[name=medCount]').value.trim() })),
    delivery: $('#delivery').value, deliveryDate: $('#date').value,
    deliveryTime: custom ? $('#timeFrom').value + '〜' + $('#timeTo').value : $('#time').value,
    deliveryAddress: $('#address').value.trim(), requestType: $('#request').value, requestText: $('#message').value.trim(),
    consent: $('#consent').checked, consentVersion: CONSENT_VERSION
  };
  if (s.residual !== 'なし' && !s.residualItems.some(x => x.name || x.count)) throw new Error('余っているお薬をご記入ください。不明な場合は「不明」とご記入ください。');
  if (s.delivery.includes('翌日') && !s.deliveryDate) throw new Error('配達の希望日をお選びください。');
  if (s.delivery !== '薬局で受け取る' && custom && toMin($('#timeFrom').value) >= toMin($('#timeTo').value)) throw new Error('希望時間帯の終了時刻は、開始時刻より後にしてください。');
  if (s.requestType !== 'なし' && !s.requestText) throw new Error('ご要望の内容をご記入ください。');
  return s;
}
async function submit() {
  if (busy || preparing || !ready) return;
  try {
    if (!snapshot) {
      if (!photos.length || !$('#consent').checked) throw new Error('写真の追加と送信への同意をご確認ください。');
      const survey = collectSurvey(), hashes = photos.map(x => x.hash);
      if (pending && JSON.stringify(pending.hashes) !== JSON.stringify(hashes)) throw new Error('前回と同じ写真を同じ順番で追加してください。受付番号：' + pending.id);
      snapshot = { survey, photos: photos.slice(), hashes };
      if (!pending) storePending({ id: crypto.randomUUID(), hashes });
    }
    busy = true; error(''); lockForm(true); screen('uploading');
    $('.uploading').setAttribute('aria-busy', 'true'); $('#upload-error').hidden = true; $('#retryBtn').disabled = true;
    $('#current-receipt').textContent = pending.id;
    $('#storage-note').hidden = storageOK;
    showChecking();
    $('#upload-title').textContent = '写真をまとめて送信しています';
    $('#upload-lead').textContent = '写真を薬局へ送っています。しばらくお待ちください。';
    $('#upload-progress').removeAttribute('value');
    $('#meter-values').hidden = true; $('#meter-detail').hidden = true;
    const result = await rpc(
      'submitPrescription',
      token(),
      pending.id,
      snapshot.survey,
      snapshot.hashes,
      snapshot.photos.map(x => x.data)
    );
    if (result.status !== 'accepted') throw new Error('受付結果を確認できませんでした。同じ受付を再開してください。');
    showComplete(result);
  } catch (e) {
    if (/\[INPUT\]/.test(e.message) && screens.uploading.hidden === false && !$('#upload-progress').hasAttribute('value')) {
      busy = false; snapshot = null; storePending(null); lockForm(false); screen('form'); error(e.message); canSend();
    } else if (busy || snapshot) showInterrupted(e);
    else error(e.message);
  }
}
$('#submitBtn').onclick = submit;
$('#retryBtn').onclick = async () => {
  if (busy) return;
  if (snapshot) { await submit(); return; }
  if (!pending) { screen('form'); return; }
  busy = true; $('#retryBtn').disabled = true;
  try {
    const r = await rpc('getPrescriptionStatus', token(), pending.id);
    if (r.status === 'accepted') { showComplete(r); return; }
    if (r.savedCount === r.total) { showComplete(await rpc('finishPrescription', token(), pending.id)); return; }
    busy = false; lockForm(false); screen('form'); error('同じ写真を同じ順番で追加して、送信を再開してください。'); canSend();
  } catch (e) { showInterrupted(e); }
};
window.addEventListener('beforeunload', e => { if (pending) { e.preventDefault(); e.returnValue = ''; } });
screen('form'); canSend();
const sdk = document.createElement('script'); sdk.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
sdk.onload = init; sdk.onerror = () => error('LINEへの接続に失敗しました。通信環境を確認して画面を開き直してください。'); document.head.append(sdk);
</script>
